# Lokale Entwicklungsumgebung: docker compose -f infrastructure/docker/docker-compose.yml up -d
# Kein Objektspeicher: FangEvo nutzt derzeit keinen S3-Speicher (Belege in der Datenbank, ADR-008).
# MinIO veröffentlicht keine Container-Abbilder mehr; ein Ersatz wird erst eingeplant, wenn S3 gebraucht wird.
name: fangevo
services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10
  redis:
    image: redis:7.4
    ports: ['6379:6379']
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['1025:1025', '8025:8025']
volumes:
  pgdata:
