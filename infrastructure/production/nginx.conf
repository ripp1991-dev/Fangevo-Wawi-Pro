# Web-Oberfläche und Weiterleitung der API unter derselben Adresse (Cookies ohne CORS).
# Sicherheits-Header stehen in security-headers.inc (nginx vererbt add_header nicht in
# location-Blöcke mit eigenem add_header, daher dort jeweils eingebunden).
# TLS wird vor diesem Container terminiert (Load Balancer / Reverse Proxy), siehe OPERATIONS.md.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # sendfile liefert auf manchen Kernel-/Overlay-Dateisystem-Kombinationen (z. B. Ubuntu 24.04-Runner)
  # abgeschnittene Dateien aus Containern; die Dateien sind klein, normales Lesen ist ausreichend schnell.
  sendfile off;
  client_max_body_size 16m;
  # Adresse der API regelmäßig neu auflösen (sonst 502 nach Neustart des API-Containers).
  # 127.0.0.11 = DNS von Docker; in Kubernetes den Cluster-DNS eintragen.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  location = /health {
    proxy_pass $api_upstream;
  }
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.inc;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
